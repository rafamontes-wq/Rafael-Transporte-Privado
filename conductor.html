<input id="correo" type="email" placeholder="Tu correo">

<label>Contraseña</label>
<input id="clave" type="password" placeholder="Tu contraseña">

<button id="entrar">INICIAR SESIÓN</button>

<p id="mensaje"></p>
</div>

<div class="card" id="panel" hidden>
<h2>Panel del conductor</h2>
<p>Bienvenido. Aquí recibirás tus solicitudes.</p>

<button id="salir">CERRAR SESIÓN</button>

<div id="solicitudes" style="margin-top:20px">
Cargando solicitudes...
</div>
</div>

</div>

<script type="module">

import { app, db } from "./firebase-config.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 ref,
 onValue,
 update
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const auth = getAuth(app);

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const mensaje = document.getElementById("mensaje");
const solicitudes = document.getElementById("solicitudes");

document.getElementById("entrar").onclick = async () => {

 const correo = document.getElementById("correo").value.trim();
 const clave = document.getElementById("clave").value;

 if (!correo || !clave) {
   mensaje.textContent = "Completa los datos.";
   return;
 }

 try {
   await signInWithEmailAndPassword(auth, correo, clave);
   mensaje.textContent = "";
 } catch (error) {
   mensaje.textContent = "Correo o contraseña incorrectos.";
 }

};

document.getElementById("salir").onclick = () => signOut(auth);

onAuthStateChanged(auth, (usuario) => {

 login.hidden = !!usuario;
 panel.hidden = !usuario;

 if (!usuario) return;

 onValue(ref(db, "solicitudes"), (snapshot) => {

   solicitudes.innerHTML = "";

   if (!snapshot.exists()) {
     solicitudes.textContent = "No hay solicitudes todavía.";
     return;
   }

   snapshot.forEach((child) => {

     const viaje = child.val();
     const id = child.key;

     const tarjeta = document.createElement("div");
     tarjeta.className = "viaje";

     const titulo = document.createElement("h3");
     titulo.textContent = "Pasajero: " + (viaje.nombre || "");

     const telefono = document.createElement("p");
     telefono.textContent = "Teléfono: " + (viaje.telefono || "");

     const destino = document.createElement("p");
     destino.textContent = "Destino: " + (viaje.destino || "");

     const estado = document.createElement("p");
     estado.textContent = "Estado: " + (viaje.estado || "");

     tarjeta.append(titulo, telefono, destino, estado);

     if (viaje.ubicacion) {

       const mapa = document.createElement("a");

       mapa.href = "https://www.google.com/maps/dir/?api=1&destination=" +
         viaje.ubicacion.latitud + "," +
         viaje.ubicacion.longitud;

       mapa.target = "_blank";
       mapa.rel = "noopener";
       mapa.textContent = "📍 VER UBICACIÓN DEL CLIENTE";

       tarjeta.appendChild(mapa);
     }

     if (viaje.estado === "pendiente") {

       const aceptar = document.createElement("button");

       aceptar.textContent = "ACEPTAR VIAJE";

       aceptar.onclick = async () => {
         await update(ref(db, "solicitudes/" + id), {
           estado: "aceptado"
         });
       };

       tarjeta.appendChild(aceptar);
     }

     solicitudes.appendChild(tarjeta);

   });

 });

});

</script>

</body>
</html>
